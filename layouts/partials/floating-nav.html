<script>
  document.addEventListener('DOMContentLoaded', () => {
    const navLinks = Array.from(document.querySelectorAll('.nav-link'));
    const indicator = document.getElementById('nav-indicator');
    const container = document.getElementById('nav-container');
    if (!navLinks.length || !indicator || !container) return;

    const visibleSections = new Set();

    const updateIndicator = () => {
      // Find all active links in DOM order
      const activeLinks = navLinks.filter(link => visibleSections.has(link.getAttribute('data-section')));

      if (activeLinks.length === 0) {
        indicator.classList.add('opacity-0');
        navLinks.forEach(link => link.classList.remove('text-neutral-950', 'dark:text-white'));
        return;
      }

      // Calculate span from first active item to last active item
      const first = activeLinks[0];
      const last = activeLinks[activeLinks.length - 1];

      const topPos = first.offsetTop;
      const height = (last.offsetTop + last.offsetHeight) - topPos;

      // Move indicator
      indicator.style.top = `${topPos}px`;
      indicator.style.height = `${height}px`;
      indicator.classList.remove('opacity-0');

      // Light up text/icons inside the bubble range
      navLinks.forEach(link => {
        if (activeLinks.includes(link)) {
          link.classList.add('text-neutral-950', 'dark:text-white');
        } else {
          link.classList.remove('text-neutral-950', 'dark:text-white');
        }
      });
    };

    const sections = [];
    navLinks.forEach(link => {
      const el = document.getElementById(link.getAttribute('data-section'));
      if (el) sections.push(el);
    });

    if (!sections.length) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          visibleSections.add(entry.target.id);
        } else {
          visibleSections.delete(entry.target.id);
        }
      });
      updateIndicator();
    }, {
      root: null,
      rootMargin: '-10% 0px -20% 0px',
      threshold: 0.15
    });

    sections.forEach(sec => observer.observe(sec));
    
    // Recalculate indicator position on window resize
    window.addEventListener('resize', updateIndicator);
  });
</script>
